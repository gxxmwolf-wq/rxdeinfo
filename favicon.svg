<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Фон -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  <!-- Капсула -->
  <g transform="rotate(-45 32 32)">
    <rect x="20" y="12" width="24" height="40" rx="12" fill="url(#pill)"/>
    <line x1="20" y1="32" x2="44" y2="32" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <!-- Медицинский крест -->
    <path d="M 32 20 V 28 M 28 24 H 36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
